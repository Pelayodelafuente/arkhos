# Backup semanal de la base de datos de Supabase.
#
# REQUIERE configurar en GitHub → Settings → Secrets and variables → Actions:
#   - SUPABASE_DB_URL        cadena de conexión Postgres (Supabase → Settings →
#                            Database → Connection string → URI, modo "Session")
#   - BACKUP_PASSPHRASE      passphrase para cifrar el dump (recomendado: los
#                            datos son patrimonio personal; el artifact queda
#                            cifrado con AES256 vía gpg)
#
# Restaurar: descargar artifact → gpg -d backup.sql.gpg > backup.sql →
#            psql "$DB_URL" -f backup.sql

name: DB Backup

on:
  schedule:
    - cron: '0 3 * * 1' # lunes 03:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL — backup no ejecutado"
            exit 1
          fi
          pg_dump "$DB_URL" --no-owner --no-privileges --schema=public \
            -f "arkhos-backup-$(date +%Y%m%d).sql"

      - name: Encrypt dump
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          FILE=$(ls arkhos-backup-*.sql)
          if [ -n "$PASSPHRASE" ]; then
            gpg --batch --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" -o "$FILE.gpg" "$FILE"
            rm "$FILE"
          else
            echo "::warning::BACKUP_PASSPHRASE no configurado — el dump se sube SIN cifrar"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: arkhos-backup-*
          retention-days: 30
