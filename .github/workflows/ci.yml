name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: TypeScript · Lint · Build · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm exec next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://arkhos.pelayodelafuente.es

      - name: Test
        run: pnpm exec vitest run

      # Auditoría de dependencias con OSV-Scanner (base de datos OSV.dev).
      # Sustituye a `pnpm audit`, cuyo endpoint "quick audit" fue retirado por
      # npm (responde 410). Escanea el lockfile y falla el build si encuentra
      # vulnerabilidades conocidas (gate bloqueante). Para silenciar un aviso
      # concreto (falso positivo o sin fix), añadir un `osv-scanner.toml`.
      - name: Audit dependencies (OSV-Scanner)
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml
