name: Trade Republic Daily Sync

on:
  schedule:
    # 08:00 UTC = 09:00 España (winter) / 10:00 (summer)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del sync manual'
        required: false
        default: 'Manual trigger'

jobs:
  sync:
    name: Sync TR → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Puppeteer
        run: node node_modules/.pnpm/puppeteer@25.1.0/node_modules/puppeteer/install.mjs

      - name: Refresh TR session (uses saved cookies, no OTP needed)
        run: npx tsx scripts/tr-refresh.mts
        continue-on-error: true  # if refresh fails, try sync with existing session
        env:
          TR_COOKIE_FILE_B64: ${{ secrets.TR_COOKIE_FILE_B64 }}

      - name: Run TR Sync
        run: npx tsx scripts/tr-sync-run.mts
        env:
          TR_PHONE: ${{ secrets.TR_PHONE }}
          TR_PIN: ${{ secrets.TR_PIN }}
          TR_COOKIE_FILE_B64: ${{ secrets.TR_COOKIE_FILE_B64 }}
          TR_USER_ID: ${{ secrets.TR_USER_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Puppeteer flags for headless Chrome in CI
          PUPPETEER_ARGS: '--no-sandbox --disable-setuid-sandbox'
