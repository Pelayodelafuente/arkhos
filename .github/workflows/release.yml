name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout on release
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Release summary
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "## Release v${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Publicada automáticamente via Release Please" >> $GITHUB_STEP_SUMMARY
